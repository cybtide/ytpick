name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile ytpick.py ytpick_cli.py
      - name: Check changelog entry for current version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ytpick.py)
          grep -qF "## [$version]" CHANGELOG.md
      - run: python -m pip install ".[thumbnails]"
      - run: ytpick-cli --version
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a python -m unittest discover -s tests -v

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller "yt-dlp[default]" pillow
      - run: pyinstaller --noconfirm --onefile --windowed --name ytpick --icon assets/icon.ico --add-data "assets;assets" --collect-all yt_dlp --collect-all yt_dlp_ejs ytpick.py
      - run: Test-Path dist/ytpick.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libtk8.6 libtcl8.6
      - run: python -c "import tkinter"
      - run: python -m pip install pyinstaller "yt-dlp[default]" pillow
      - run: pyinstaller --noconfirm --onefile --windowed --name ytpick --add-data "assets:assets" --collect-all yt_dlp --collect-all yt_dlp_ejs ytpick.py
      - run: pyinstaller --noconfirm --onefile --name ytpick-cli --collect-all yt_dlp --collect-all yt_dlp_ejs ytpick_cli.py
      - run: dist/ytpick-cli --version
